<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Food</title>
    <link rel="stylesheet" th:href="@{/Bootstrap/css/bootstrap.min.css}">
    <script th:src="@{/Bootstrap/js/bootstrap.bundle.min.js}"></script></head>
<body class="container mt-5">

<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-header">
        <h4>Add New Food</h4>
    </div>
    <div class="card-body">
        <form th:action="@{/save}" th:object="${food}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Calories (Cal)</label>
                <input type="number" th:field="*{calories}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Amount</label>
                <input type="number" th:field="*{amount}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price (KZT)</label>
                <input type="number" th:field="*{price}" class="form-control" required>
            </div>

            <div class="d-flex justify-content-start gap-2">
                <button type="submit" class="btn btn-primary">Add Food</button>
                <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
