<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Food List</title>
    <link rel="stylesheet" th:href="@{/Bootstrap/css/bootstrap.min.css}">
    <script th:src="@{/Bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between mb-3">
    <h2>Food List</h2>
    <a th:href="@{/add}" class="btn btn-primary">ADD NEW +</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-light">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Calories (Cal)</th>
        <th>Amount</th>
        <th>Price (KZT)</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="food : ${foods}">
        <td th:text="${food.id}"></td>
        <td th:text="${food.name}"></td>
        <td th:text="${food.calories}"></td>
        <td th:text="${food.amount}"></td>
        <td th:text="${food.price}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${food.id})}" class="btn btn-info btn-sm text-white">Edit</a>
        </td>
        <td>
            <form th:action="@{/delete/{id}(id=${food.id})}" method="post">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
