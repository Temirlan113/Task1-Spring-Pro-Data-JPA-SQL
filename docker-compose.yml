version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: Tech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: satorugod1
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: food_app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/Tech
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: satorugod1
      SPRING_JPA_HIBERNATE_DDL_AUTO: update